name: Issue 100 release hygiene validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Delete merged stale agent branches
        env:
          CURRENT_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin main '+refs/heads/agent/*:refs/remotes/origin/agent/*'
          deleted=0
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            if [ "$branch" = "$CURRENT_BRANCH" ]; then
              continue
            fi
            if git merge-base --is-ancestor "$ref" origin/main; then
              echo "Deleting merged branch: $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            else
              echo "Keeping unmerged branch: $branch"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/agent/)
          echo "Deleted $deleted merged agent branches"
