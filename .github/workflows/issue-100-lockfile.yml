name: Issue 100 release hygiene validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Delete merged and superseded stale agent branches
        env:
          CURRENT_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin main '+refs/heads/agent/*:refs/remotes/origin/agent/*'
          deleted=0
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            if [ "$branch" = "$CURRENT_BRANCH" ]; then
              continue
            fi
            if git merge-base --is-ancestor "$ref" origin/main; then
              echo "Deleting merged branch: $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/agent/)

          for branch in \
            agent/issue-62-edge-tab-id \
            agent/issue-80-white-wiki-images \
            agent/issue-80-white-wiki-images-v2 \
            agent/issue-90-brand-css-import \
            agent/map-verified-multiraid-payloads \
            agent/map-verified-multiraid-payloads-v2 \
            agent/map-verified-multiraid-payloads-v3; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting documented superseded branch: $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            fi
          done
          echo "Deleted $deleted additional stale agent branches"
      - name: Remove temporary validation workflow from PR head
        env:
          CURRENT_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-100-lockfile.yml
          git commit -m "Remove temporary release validation workflow"
          git push origin HEAD:"$CURRENT_BRANCH"
