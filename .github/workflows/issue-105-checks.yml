name: Issue 105 checks

on:
  push:
    branches:
      - agent/issue-105-combat-live-ui

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: npm test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log
      - name: npm run typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: npm run build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: git diff --check
        id: diffcheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee diff-check.log
      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-105-check-logs
          path: '*.log'
          if-no-files-found: error
      - name: Fail on check errors
        if: always() && (steps.tests.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.build.outcome != 'success' || steps.diffcheck.outcome != 'success')
        run: exit 1
